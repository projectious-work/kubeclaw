[defaults]
inventory = inventory.ini
remote_user = kubernetes-admin
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
# ForwardAgent enables use of the local ssh-agent
# ControlMaster/ControlPersist speed up repeated connections
ssh_args = -o ForwardAgent=yes -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=no
control_path = ~/.ansible/cp/%%h-%%p-%%r
