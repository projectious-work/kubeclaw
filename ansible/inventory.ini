# =============================================================================
# Ansible Inventory für Hetzner K3s Cluster
# =============================================================================
# Dieses Inventory wird manuell gepflegt oder per Script generiert.
# Alternativ: Dynamisches Inventory mit hetzner.hcloud.hcloud Plugin
# =============================================================================

[control_nodes]
control-01 ansible_host=10.0.0.2

[worker_nodes]
# worker-01 ansible_host=10.0.0.3
# worker-02 ansible_host=10.0.0.4

[k3s_cluster:children]
control_nodes
worker_nodes

[all:vars]
ansible_user=kubernetes-admin
ansible_ssh_private_key_file=~/.ssh/k3s-cluster_control-node_key

# Für Worker-Nodes separaten Key verwenden:
# ansible_ssh_private_key_file wird pro Gruppe überschrieben

[worker_nodes:vars]
ansible_ssh_private_key_file=~/.ssh/k3s-cluster_worker-node_key

# ProxyJump über Cloudflare Tunnel
ansible_ssh_common_args='-o ProxyCommand="cloudflared access ssh --hostname console.bernhard-gerlach.org"'
