# =============================================================================
# Ansible Inventory for Hetzner k8s Cluster
# =============================================================================
# This inventory is maintained manually or generated via script.
# Alternative: Dynamic inventory with hetzner.hcloud.hcloud plugin
# =============================================================================

[control_nodes]
control-01 ansible_host=10.0.0.2

[worker_nodes]
# worker-01 ansible_host=10.0.0.3
# worker-02 ansible_host=10.0.0.4

[k8s_cluster:children]
control_nodes
worker_nodes

[all:vars]
ansible_user=kubernetes-admin
ansible_ssh_private_key_file=~/.ssh/k8s-cluster_control-node_key

# Use a separate key for worker nodes:
# ansible_ssh_private_key_file is overridden per group

[worker_nodes:vars]
ansible_ssh_private_key_file=~/.ssh/k8s-cluster_worker-node_key

# ProxyJump via Cloudflare Tunnel
ansible_ssh_common_args='-o ProxyCommand="cloudflared access ssh --hostname console.bernhard-gerlach.org"'
