#cloud-config

# =============================================================================
# SERVER C - Temporary server with external SSH access (admin node)
# =============================================================================

users:
  # Main user for SSH access
  - name: kubernetes-admin
    groups: users, admin, sudo
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBX9TWFuRBHnN8yv2ORCKPyPIpNczWMJxV6/LqkV8Kuj

keyboard:
  layout: de
  variant: mac

packages:
  - fail2ban
  - ufw

package_update: true
package_upgrade: true

write_files:
  # SSH hardening (stricter than Server A)
  - path: /etc/ssh/sshd_config.d/ssh-hardening.conf
    content: |
      # Basic security
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      MaxAuthTries 3

      # Allow TCP forwarding for ProxyJump
      AllowTcpForwarding yes

      # All other forwarding options disabled (not needed)
      X11Forwarding no
      AllowAgentForwarding no

      # Only this user may connect
      AllowUsers kubernetes-admin

      # Idle timeout
      ClientAliveInterval 300
      ClientAliveCountMax 2

  # fail2ban configuration
  - path: /etc/fail2ban/jail.local
    content: |
      [sshd]
      enabled = true
      port = 22
      banaction = iptables-multiport
      maxretry = 3
      findtime = 600
      bantime = 3600

runcmd:
  # Enable fail2ban
  - systemctl enable fail2ban
  - systemctl start fail2ban

  # Configure UFW firewall
  - ufw allow 22

  # Enable firewall
  - ufw --force enable

  # Reboot to apply all changes
  - reboot
