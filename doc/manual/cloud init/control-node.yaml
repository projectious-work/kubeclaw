#cloud-config

# =============================================================================
# SERVER A - With Cloudflare Tunnel (gateway server, control node)
# =============================================================================
# This server is the only one with external access via Cloudflare Tunnel.
# It serves as a bastion/jump host for Server B.
# =============================================================================
# https://community.hetzner.com/tutorials/basic-cloud-config/de


users:
  # Root user with password for Web Console emergency access
  - name: root
    plain_text_passwd: 'runny-clapper'
    lock_passwd: false
  # Main user for SSH access
  - name: kubernetes-admin
    groups: users, admin, sudo
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKywQeZ+fhz0Hq0M2wzMmVR+QcHimflU/XSifrPfAL39

keyboard:
  layout: de
  variant: mac


packages:
  - fail2ban
  - ufw
  - curl
  - wget

package_update: true
package_upgrade: true

write_files:
  # SSH hardening
  - path: /etc/ssh/sshd_config.d/ssh-hardening.conf
    content: |
      # Basic security
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      MaxAuthTries 3

      # Disable unnecessary features
      X11Forwarding no
      AllowAgentForwarding no

      # Allow TCP forwarding for ProxyJump to Server B
      AllowTcpForwarding yes

      # Only this user may connect
      AllowUsers kubernetes-admin

      # Idle timeout (optional)
      ClientAliveInterval 300
      ClientAliveCountMax 2

  # fail2ban configuration
  - path: /etc/fail2ban/jail.local
    content: |
      [sshd]
      enabled = true
      port = 22
      banaction = iptables-multiport
      maxretry = 3
      findtime = 600
      bantime = 3600

  # Cloudflared config to use IPv6 only
  - path: /etc/cloudflared/config.yml
    content: |
      edge-ip-version: "6"

runcmd:
  # Enable fail2ban
  - systemctl enable fail2ban
  - systemctl start fail2ban

  # Configure UFW firewall
  # Allow SSH only from internal network
  - ufw allow from 10.0.0.0/8 to any port 22 proto tcp comment 'SSH internal'

  # If using SSH via Cloudflare Tunnel,
  # this rule allows SSH from localhost (where cloudflared runs)
  - ufw allow from 127.0.0.1 to any port 22 proto tcp comment 'SSH via Tunnel'

  # Outbound: DNS, HTTP, HTTPS for Cloudflare Tunnel and updates
  # (UFW allows outbound by default, but explicit is better)
  - ufw default deny incoming
  - ufw default allow outgoing

  # Enable firewall
  - ufw --force enable

  # Add Cloudflare GPG key
  - mkdir -p --mode=0755 /usr/share/keyrings
  - curl -fsSL https://pkg.cloudflare.com/cloudflare-public-v2.gpg | tee /usr/share/keyrings/cloudflare-public-v2.gpg >/dev/null

  # Add this repo to your apt repositories
  - echo 'deb [signed-by=/usr/share/keyrings/cloudflare-public-v2.gpg] https://pkg.cloudflare.com/cloudflared any main' | tee /etc/apt/sources.list.d/cloudflared.list

  - mkdir -p /etc/cloudflared
  # Install cloudflared
  - apt-get update && sudo apt-get install cloudflared

  # Reboot to apply all changes
  - reboot
