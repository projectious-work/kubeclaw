#cloud-config

# =============================================================================
# SERVER A - Mit Cloudflare Tunnel (Gateway-Server, control node)
# =============================================================================
# Dieser Server ist der einzige mit Außenwelt-Zugang via Cloudflare Tunnel.
# Er dient als Bastion/Jump-Host für Server B.
# =============================================================================
# https://community.hetzner.com/tutorials/basic-cloud-config/de


users:
  # Root-User mit Passwort für Web-Console Notfall-Zugang
  - name: root
    plain_text_passwd: 'runny-clapper'
    lock_passwd: false
  # Haupt-User für SSH-Zugang
  - name: kubernetes-admin
    groups: users, admin, sudo
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKywQeZ+fhz0Hq0M2wzMmVR+QcHimflU/XSifrPfAL39 

keyboard:
  layout: de
  variant: mac


packages:
  - fail2ban
  - ufw
  - curl
  - wget

package_update: true
package_upgrade: true

write_files:
  # SSH-Härtung
  - path: /etc/ssh/sshd_config.d/ssh-hardening.conf
    content: |
      # Grundlegende Sicherheit
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      MaxAuthTries 3
      
      # Nicht benötigte Features deaktivieren
      X11Forwarding no
      AllowAgentForwarding no
      
      # TCP-Forwarding erlauben für ProxyJump zu Server B
      AllowTcpForwarding yes
      
      # Nur dieser User darf sich verbinden
      AllowUsers kubernetes-admin
      
      # Idle-Timeout (optional)
      ClientAliveInterval 300
      ClientAliveCountMax 2

  # fail2ban Konfiguration
  - path: /etc/fail2ban/jail.local
    content: |
      [sshd]
      enabled = true
      port = 22
      banaction = iptables-multiport
      maxretry = 3
      findtime = 600
      bantime = 3600

  # Cloudflared Config to use IPv6 only
  - path: /etc/cloudflared/config.yml
    content: |
      edge-ip-version: "6"

runcmd:
  # fail2ban aktivieren
  - systemctl enable fail2ban
  - systemctl start fail2ban
  
  # UFW Firewall konfigurieren
  # SSH nur vom internen Netzwerk erlauben
  - ufw allow from 10.0.0.0/8 to any port 22 proto tcp comment 'SSH intern'
  
  # Falls du SSH auch über Cloudflare Tunnel nutzen willst,
  # erlaubt diese Regel SSH von localhost (wo cloudflared läuft)
  - ufw allow from 127.0.0.1 to any port 22 proto tcp comment 'SSH via Tunnel'
  
  # Ausgehend: DNS, HTTP, HTTPS für Cloudflare Tunnel und Updates
  # (UFW erlaubt ausgehend standardmäßig, aber explizit ist besser)
  - ufw default deny incoming
  - ufw default allow outgoing
  
  # Firewall aktivieren
  - ufw --force enable
  
  # Add cloudflare gpg key
  - mkdir -p --mode=0755 /usr/share/keyrings
  - curl -fsSL https://pkg.cloudflare.com/cloudflare-public-v2.gpg | tee /usr/share/keyrings/cloudflare-public-v2.gpg >/dev/null

  # Add this repo to your apt repositories
  - echo 'deb [signed-by=/usr/share/keyrings/cloudflare-public-v2.gpg] https://pkg.cloudflare.com/cloudflared any main' | tee /etc/apt/sources.list.d/cloudflared.list
  
  - mkdir -p /etc/cloudflared
  # install cloudflared
  - apt-get update && sudo apt-get install cloudflared
 
  # Neustart um alle Änderungen zu aktivieren
  - reboot
