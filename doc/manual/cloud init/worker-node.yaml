#cloud-config

# =============================================================================
# SERVER B - Nur internes Netzwerk (isolierter Server)
# =============================================================================
# Dieser Server ist NUR über das interne Netzwerk erreichbar.
# Zugang erfolgt ausschließlich über Server A (ProxyJump) oder Web-Console.
# Nach der Einrichtung: Öffentliche IP in Hetzner Console deaktivieren!
# =============================================================================

users:
  # Root-User mit Passwort für Web-Console Notfall-Zugang
  - name: root
    plain_text_passwd: 'ranked-ridden'
    lock_passwd: false
  # Haupt-User für SSH-Zugang
  - name: kubernetes-admin
    groups: users, admin, sudo
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPUpl7LY4GK6hmahc0jPybVVYxrNZsSKy3q9iyGw+7DN

keyboard:
  layout: de
  variant: mac

packages:
  - fail2ban
  - ufw

package_update: true
package_upgrade: true

write_files:
  # SSH-Härtung (strenger als Server A)
  - path: /etc/ssh/sshd_config.d/ssh-hardening.conf
    content: |
      # Grundlegende Sicherheit
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      MaxAuthTries 3
      
      # Alle Forwarding-Optionen deaktiviert (nicht benötigt)
      AllowTcpForwarding no
      X11Forwarding no
      AllowAgentForwarding no
      
      # Nur dieser User darf sich verbinden
      AllowUsers kubernetes-admin
      
      # Idle-Timeout
      ClientAliveInterval 300
      ClientAliveCountMax 2

  # fail2ban Konfiguration
  - path: /etc/fail2ban/jail.local
    content: |
      [sshd]
      enabled = true
      port = 22
      banaction = iptables-multiport
      maxretry = 3
      findtime = 600
      bantime = 3600

runcmd:
  # fail2ban aktivieren
  - systemctl enable fail2ban
  - systemctl start fail2ban
  
  # UFW Firewall konfigurieren - SEHR restriktiv
  # Alles verbieten außer internes Netzwerk
  - ufw default deny incoming
  - ufw default deny outgoing
  
  # Eingehend: Nur SSH vom internen Netzwerk
  - ufw allow from 10.0.0.0/8 to any port 22 proto tcp comment 'SSH intern'
  
  # Eingehend: Ping vom internen Netzwerk (optional, für Debugging)
  - ufw allow from 10.0.0.0/8 proto icmp comment 'ICMP intern'
  
  # Ausgehend: Nur zum internen Netzwerk
  - ufw allow out to 10.0.0.0/8 comment 'Ausgehend intern'
  
  # Ausgehend: DNS für apt (Hetzner DNS Server)
  - ufw allow out to 185.12.64.1 port 53 proto udp comment 'DNS Hetzner'
  - ufw allow out to 185.12.64.2 port 53 proto udp comment 'DNS Hetzner'
  
  # Ausgehend: HTTP/HTTPS für apt Updates (optional, kann später entfernt werden)
  - ufw allow out to any port 80 proto tcp comment 'HTTP fuer Updates'
  - ufw allow out to any port 443 proto tcp comment 'HTTPS fuer Updates'
  
  # Firewall aktivieren
  - ufw --force enable
  
  # Neustart um alle Änderungen zu aktivieren
  - reboot

# =============================================================================
# NACH DER INSTALLATION:
# =============================================================================
# 1. Teste SSH-Zugang über Server A:
#    ssh -J admin@<server-a-ip> admin@<server-b-interne-ip>
#
# 2. Wenn alles funktioniert, gehe in die Hetzner Console:
#    Server → Networking → Public Network → Disable
#
# 3. Optional: Entferne die HTTP/HTTPS ufw-Regeln wenn keine Updates mehr nötig:
#    sudo ufw delete allow out to any port 80 proto tcp
#    sudo ufw delete allow out to any port 443 proto tcp
# =============================================================================
