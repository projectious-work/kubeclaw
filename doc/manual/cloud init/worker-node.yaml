#cloud-config

# =============================================================================
# SERVER B - Internal network only (isolated server)
# =============================================================================
# This server is ONLY reachable via the internal network.
# Access is exclusively through Server A (ProxyJump) or Web Console.
# After setup: Disable public IP in Hetzner Console!
# =============================================================================

users:
  # Root user with password for Web Console emergency access
  - name: root
    plain_text_passwd: 'ranked-ridden'
    lock_passwd: false
  # Main user for SSH access
  - name: kubernetes-admin
    groups: users, admin, sudo
    sudo: ALL=(ALL) NOPASSWD:ALL
    shell: /bin/bash
    ssh_authorized_keys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIPUpl7LY4GK6hmahc0jPybVVYxrNZsSKy3q9iyGw+7DN

keyboard:
  layout: de
  variant: mac

packages:
  - fail2ban
  - ufw

package_update: true
package_upgrade: true

write_files:
  # SSH hardening (stricter than Server A)
  - path: /etc/ssh/sshd_config.d/ssh-hardening.conf
    content: |
      # Basic security
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      ChallengeResponseAuthentication no
      MaxAuthTries 3

      # All forwarding options disabled (not needed)
      AllowTcpForwarding no
      X11Forwarding no
      AllowAgentForwarding no

      # Only this user may connect
      AllowUsers kubernetes-admin

      # Idle timeout
      ClientAliveInterval 300
      ClientAliveCountMax 2

  # fail2ban configuration
  - path: /etc/fail2ban/jail.local
    content: |
      [sshd]
      enabled = true
      port = 22
      banaction = iptables-multiport
      maxretry = 3
      findtime = 600
      bantime = 3600

runcmd:
  # Enable fail2ban
  - systemctl enable fail2ban
  - systemctl start fail2ban

  # Configure UFW firewall - VERY restrictive
  # Deny everything except internal network
  - ufw default deny incoming
  - ufw default deny outgoing

  # Inbound: Only SSH from internal network
  - ufw allow from 10.0.0.0/8 to any port 22 proto tcp comment 'SSH internal'

  # Inbound: Ping from internal network (optional, for debugging)
  - ufw allow from 10.0.0.0/8 proto icmp comment 'ICMP internal'

  # Outbound: Only to internal network
  - ufw allow out to 10.0.0.0/8 comment 'Outbound internal'

  # Outbound: DNS for apt (Hetzner DNS servers)
  - ufw allow out to 185.12.64.1 port 53 proto udp comment 'DNS Hetzner'
  - ufw allow out to 185.12.64.2 port 53 proto udp comment 'DNS Hetzner'

  # Outbound: HTTP/HTTPS for apt updates (optional, can be removed later)
  - ufw allow out to any port 80 proto tcp comment 'HTTP for updates'
  - ufw allow out to any port 443 proto tcp comment 'HTTPS for updates'

  # Enable firewall
  - ufw --force enable

  # Reboot to apply all changes
  - reboot

# =============================================================================
# AFTER INSTALLATION:
# =============================================================================
# 1. Test SSH access via Server A:
#    ssh -J admin@<server-a-ip> admin@<server-b-internal-ip>
#
# 2. If everything works, go to Hetzner Console:
#    Server → Networking → Public Network → Disable
#
# 3. Optional: Remove HTTP/HTTPS UFW rules when updates are no longer needed:
#    sudo ufw delete allow out to any port 80 proto tcp
#    sudo ufw delete allow out to any port 443 proto tcp
# =============================================================================
